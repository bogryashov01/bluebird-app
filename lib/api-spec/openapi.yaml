openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bluebird private aviation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: flights
    description: Empty leg flights
  - name: queue
    description: Queue management
  - name: trips
    description: User trips
  - name: membership
    description: Membership management
  - name: referral
    description: Referral program
  - name: notifications
    description: User notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flights:
    get:
      operationId: listFlights
      tags: [flights]
      summary: List available empty leg flights (public)
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of flights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flight"

  /flights/{id}:
    get:
      operationId: getFlight
      tags: [flights]
      summary: Get flight details (public)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flight details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /queue/join:
    post:
      operationId: joinQueue
      tags: [queue]
      summary: Join queue for a flight
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinQueueRequest"
      responses:
        "201":
          description: Joined queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /queue/status:
    get:
      operationId: getQueueStatus
      tags: [queue]
      summary: Get user queue status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueEntry"

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: Get user trips
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"

  /membership:
    get:
      operationId: getMembership
      tags: [membership]
      summary: Get user membership
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membership details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /membership/upgrade:
    post:
      operationId: upgradeMembership
      tags: [membership]
      summary: Upgrade membership tier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeMembershipRequest"
      responses:
        "200":
          description: Membership upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /referral:
    get:
      operationId: getReferral
      tags: [referral]
      summary: Get referral info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Referral info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralInfo"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - name
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        membershipTier:
          type: string
          enum: [base, plus, concierge]
        emailVerified:
          type: boolean
        linePassCount:
          type: number
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - membershipTier
        - emailVerified
        - linePassCount
        - createdAt

    Flight:
      type: object
      properties:
        id:
          type: string
        fromAirport:
          type: string
        fromCity:
          type: string
        toAirport:
          type: string
        toCity:
          type: string
        aircraftType:
          type: string
        aircraftCapacity:
          type: number
        departureDate:
          type: string
        departureTime:
          type: string
        duration:
          type: string
        seatsAvailable:
          type: number
        priceUsd:
          type: number
        discountPct:
          type: number
        featured:
          type: boolean
        status:
          type: string
          enum: [available, boarding, departed, cancelled]
        imageUrl:
          type: string
        createdAt:
          type: string
      required:
        - id
        - fromAirport
        - fromCity
        - toAirport
        - toCity
        - aircraftType
        - aircraftCapacity
        - departureDate
        - departureTime
        - duration
        - seatsAvailable
        - status
        - createdAt

    JoinQueueRequest:
      type: object
      properties:
        flightId:
          type: string
        useLinePass:
          type: boolean
      required:
        - flightId

    QueueEntry:
      type: object
      properties:
        id:
          type: string
        flightId:
          type: string
        flight:
          $ref: "#/components/schemas/Flight"
        position:
          type: number
        totalInQueue:
          type: number
        status:
          type: string
          enum: [waiting, confirmed, cancelled, expired]
        createdAt:
          type: string
      required:
        - id
        - flightId
        - position
        - totalInQueue
        - status
        - createdAt

    Trip:
      type: object
      properties:
        id:
          type: string
        flightId:
          type: string
        flight:
          $ref: "#/components/schemas/Flight"
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        bookedAt:
          type: string
      required:
        - id
        - flightId
        - status
        - bookedAt

    Membership:
      type: object
      properties:
        tier:
          type: string
          enum: [base, plus, concierge]
        linePassCount:
          type: number
        renewalDate:
          type: string
        features:
          type: array
          items:
            type: string
      required:
        - tier
        - linePassCount
        - features

    UpgradeMembershipRequest:
      type: object
      properties:
        tier:
          type: string
          enum: [plus, concierge]
      required:
        - tier

    ReferralInfo:
      type: object
      properties:
        code:
          type: string
        totalReferrals:
          type: number
        earnedPasses:
          type: number
        pendingPasses:
          type: number
      required:
        - code
        - totalReferrals
        - earnedPasses
        - pendingPasses

    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        type:
          type: string
          enum: [queue_update, flight_confirmed, membership, referral, system]
        read:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - title
        - body
        - type
        - read
        - createdAt
