openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bluebird private aviation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: flights
    description: Empty leg flights
  - name: queue
    description: Queue management
  - name: trips
    description: User trips
  - name: membership
    description: Membership management
  - name: referral
    description: Referral program
  - name: notifications
    description: User notifications
  - name: concierge
    description: AI concierge chat

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/request-code:
    post:
      operationId: requestLoginCode
      tags: [auth]
      summary: Request a 6-digit SMS sign-in code for a phone number (demo — code returned in response and logged, no real SMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCodeRequest"
      responses:
        "200":
          description: Code issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCodeResponse"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Resend cooldown active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: SMS delivery not configured (production — no provider wired; demo delivery is non-production only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-code:
    post:
      operationId: verifyLoginCode
      tags: [auth]
      summary: Verify a phone + 6-digit code, creating the account on first sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong, expired, or exhausted code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the caller's current token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flights:
    get:
      operationId: listFlights
      tags: [flights]
      summary: List available empty leg flights (public)
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of flights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flight"

  /flights/airports:
    get:
      operationId: listAirports
      tags: [flights]
      summary: List departure airports derived from flight data (public)
      responses:
        "200":
          description: List of airports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AirportInfo"

  /flights/airports/{code}/summary:
    get:
      operationId: getAirportSummary
      tags: [flights]
      summary: Airport activity summary for onboarding (public)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Airport summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportSummary"
        "404":
          description: Airport not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flights/{id}:
    get:
      operationId: getFlight
      tags: [flights]
      summary: Get flight details (public)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flight details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flights/{id}/my-status:
    get:
      operationId: getFlightMyStatus
      tags: [flights]
      summary: Get the authenticated user's relationship to a specific flight
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User flight status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightUserStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Flight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /queue/join:
    post:
      operationId: joinQueue
      tags: [queue]
      summary: Join queue for a flight
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinQueueRequest"
      responses:
        "201":
          description: Joined queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /queue/status:
    get:
      operationId: getQueueStatus
      tags: [queue]
      summary: Get user queue status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueEntry"

  /queue/{id}:
    delete:
      operationId: cancelQueueEntry
      tags: [queue]
      summary: Cancel (leave) a queue entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue entry cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelQueueResponse"
        "404":
          description: Queue entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /queue/{id}/use-pass:
    post:
      operationId: useLinePassOnQueueEntry
      tags: [queue]
      summary: Apply a Skip the Line pass to an existing waiting queue entry, moving it to position 1
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pass applied and seat confirmed, or the entry was already confirmed (alreadyConfirmed=true, no pass consumed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseLinePassResponse"
        "400":
          description: Entry cancelled/expired, already at position 1, or no passes available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Queue entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{id}/cancel:
    post:
      operationId: cancelTrip
      tags: [trips]
      summary: Cancel a confirmed booking — releases the seat, refunds a used Skip the Line pass, idempotent on repeat calls
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking cancelled (or already cancelled — idempotent, no double refund)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Flight already departed, trip already completed, or concurrent update conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: Get user trips
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"

  /membership:
    get:
      operationId: getMembership
      tags: [membership]
      summary: Get user membership
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membership details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /membership/upgrade:
    post:
      operationId: upgradeMembership
      tags: [membership]
      summary: Upgrade membership tier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeMembershipRequest"
      responses:
        "200":
          description: Membership upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /membership/buy-pass:
    post:
      operationId: buyLinePass
      tags: [membership]
      summary: Buy one Skip the Line pass (demo checkout — no real billing)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pass purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyPassResponse"
        "501":
          description: Demo checkout disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /membership/change:
    post:
      operationId: changeMembership
      tags: [membership]
      summary: Schedule a downgrade or cancellation at next renewal, or revert a pending change
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMembershipRequest"
      responses:
        "200":
          description: Membership change scheduled (or reverted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          description: Invalid change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /referral:
    get:
      operationId: getReferral
      tags: [referral]
      summary: Get referral info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Referral info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralInfo"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /concierge/chat:
    post:
      operationId: conciergeChat
      tags: [concierge]
      summary: Send a message to the AI concierge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeChatRequest"
      responses:
        "200":
          description: Concierge reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeReply"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /concierge/history:
    get:
      operationId: getConciergeHistory
      tags: [concierge]
      summary: Load the caller's recent concierge conversation history
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent concierge messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConciergeHistoryMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ConciergeChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
    ConciergeChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ConciergeChatMessage"
    ConciergeHistoryMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
    ConciergeReply:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable error code (e.g. MEMBERSHIP_REQUIRED) for client-side routing.
      required:
        - error

    SignOutResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RequestCodeRequest:
      type: object
      properties:
        phone:
          type: string
          description: Phone number in any common format; normalized server-side.
      required:
        - phone

    RequestCodeResponse:
      type: object
      properties:
        message:
          type: string
        phone:
          type: string
          description: The normalized phone number the code was issued for.
        demoCode:
          type: string
          description: Demo only — the raw 6-digit code in lieu of a delivered SMS.
        expiresInSeconds:
          type: number
        resendCooldownSeconds:
          type: number
      required:
        - message
        - phone

    VerifyCodeRequest:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
          description: The 6-digit SMS code.
        name:
          type: string
          description: Optional display name for the member; applied only when this verification creates a new account.
      required:
        - phone
        - code

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
        isNewUser:
          type: boolean
          description: True when this verification created the account.
      required:
        - token
        - user

    UpdateMeRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        homeAirport:
          type: string
          nullable: true
          description: IATA-style code of an airport served by Bluebird; null clears it.

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        membershipTier:
          type: string
          enum: [none, base, plus, concierge]
          description: '"none" marks a registered non-member who has not purchased a plan yet.'
        linePassCount:
          type: number
        referralCode:
          type: string
        homeAirport:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - name
        - phone
        - membershipTier
        - linePassCount
        - referralCode
        - createdAt

    Flight:
      type: object
      properties:
        id:
          type: string
        fromAirport:
          type: string
        fromCity:
          type: string
        toAirport:
          type: string
        toCity:
          type: string
        aircraftType:
          type: string
        aircraftCapacity:
          type: number
        departureDate:
          type: string
        departureTime:
          type: string
        duration:
          type: string
        seatsAvailable:
          type: number
        priceUsd:
          type: number
        discountPct:
          type: number
        featured:
          type: boolean
        international:
          type: boolean
        internationalFeeUsd:
          type: number
        rangeNm:
          type: number
          nullable: true
        cruiseSpeed:
          type: string
          nullable: true
        destWeather:
          type: string
          nullable: true
        departureFbo:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, boarding, departed, completed, cancelled]
        imageUrl:
          type: string
        createdAt:
          type: string
      required:
        - id
        - fromAirport
        - fromCity
        - toAirport
        - toCity
        - aircraftType
        - aircraftCapacity
        - departureDate
        - departureTime
        - duration
        - seatsAvailable
        - status
        - createdAt

    AirportInfo:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        city:
          type: string
        flightCount:
          type: number
      required:
        - code
        - name
        - city
        - flightCount

    AirportDestination:
      type: object
      properties:
        code:
          type: string
        city:
          type: string
        count:
          type: number
      required:
        - code
        - city
        - count

    AirportSummary:
      type: object
      properties:
        airport:
          $ref: "#/components/schemas/AirportInfo"
        flightCount30d:
          type: number
        topDestinations:
          type: array
          items:
            $ref: "#/components/schemas/AirportDestination"
        recentFlights:
          type: array
          items:
            $ref: "#/components/schemas/Flight"
      required:
        - airport
        - flightCount30d
        - topDestinations
        - recentFlights

    JoinQueueRequest:
      type: object
      properties:
        flightId:
          type: string
        useLinePass:
          type: boolean
        passengers:
          type: number
          minimum: 1
          maximum: 10
          default: 1
        acceptIntlFee:
          type: boolean
          description: >
            Base member accepted the one-time international fee for this
            flight (demo charge — recorded, never billed).
      required:
        - flightId

    CancelQueueResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    QueueEntry:
      type: object
      properties:
        id:
          type: string
        flightId:
          type: string
        flight:
          $ref: "#/components/schemas/Flight"
        position:
          type: number
        totalInQueue:
          type: number
        status:
          type: string
          enum: [waiting, confirmed, cancelled, expired]
        createdAt:
          type: string
        movementHistory:
          type: array
          description: >-
            Append-only movement log — a 'joined' event recorded at insert time
            plus a 'moved' event for each position improvement.
          items:
            $ref: "#/components/schemas/QueueMovementEvent"
      required:
        - id
        - flightId
        - position
        - totalInQueue
        - status
        - createdAt
    QueueMovementEvent:
      type: object
      properties:
        type:
          type: string
          enum: [joined, moved]
        position:
          type: number
          description: Initial position (joined events only).
        from:
          type: number
          description: Previous position (moved events only).
        to:
          type: number
          description: New position (moved events only).
        at:
          type: string
          description: UTC ISO-8601 timestamp of the event.
      required:
        - type
        - at

    UseLinePassResponse:
      allOf:
        - $ref: "#/components/schemas/QueueEntry"
        - type: object
          properties:
            linePassCount:
              type: number
              description: The user's remaining Skip the Line pass balance after use
            alreadyConfirmed:
              type: boolean
              description: True when the entry was already confirmed before the pass was applied — no pass was consumed
          required:
            - linePassCount

    FlightUserStatus:
      type: object
      properties:
        status:
          type: string
          enum: [none, waiting, confirmed]
        queueEntryId:
          type: string
        queuePosition:
          type: number
        totalInQueue:
          type: number
        tripId:
          type: string
      required:
        - status

    Trip:
      type: object
      properties:
        id:
          type: string
        flightId:
          type: string
        flight:
          $ref: "#/components/schemas/Flight"
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        bookedAt:
          type: string
      required:
        - id
        - flightId
        - status
        - bookedAt

    CancelBookingResponse:
      type: object
      properties:
        success:
          type: boolean
        passRefunded:
          type: boolean
          description: True when a Skip the Line pass spent on this booking was returned to the member's balance.
        linePassCount:
          type: number
          description: The member's pass balance after the cancellation.
        trip:
          $ref: "#/components/schemas/Trip"
      required:
        - success
        - passRefunded
        - linePassCount

    MembershipPlan:
      type: object
      properties:
        id:
          type: string
          enum: [base, plus, concierge]
        label:
          type: string
        priceMonthlyUsd:
          type: number
        features:
          type: array
          items:
            type: string
      required:
        - id
        - label
        - priceMonthlyUsd
        - features

    Membership:
      type: object
      properties:
        tier:
          type: string
          enum: [none, base, plus, concierge]
        plans:
          type: array
          description: Purchasable plan catalog (always present; drives the non-member join screen).
          items:
            $ref: "#/components/schemas/MembershipPlan"
        linePassCount:
          type: number
        renewalDate:
          type: string
        pendingTier:
          type: string
          enum: [base, plus, cancelled]
          description: >
            Scheduled plan change taking effect at renewalDate. "cancelled"
            means the membership ends at renewal. Absent when no change is pending.
        features:
          type: array
          items:
            type: string
        totalSavedUsd:
          type: number
          description: Sum of charter values (flight priceUsd) across the member's completed trips
        referralBalanceUsd:
          type: number
          description: Dollar balance earned from the referral program
        annualFlightAllowance:
          type: number
          description: The tier's annual flight allowance
        flightsThisYear:
          type: number
          description: Completed flights in the current calendar year
      required:
        - tier
        - linePassCount
        - features
        - totalSavedUsd
        - referralBalanceUsd
        - annualFlightAllowance
        - flightsThisYear

    BuyPassResponse:
      type: object
      properties:
        linePassCount:
          type: number
      required:
        - linePassCount

    UpgradeMembershipRequest:
      type: object
      properties:
        tier:
          type: string
          enum: [base, plus, concierge]
          description: Non-members may purchase any tier, including Base.
      required:
        - tier

    ChangeMembershipRequest:
      type: object
      properties:
        action:
          type: string
          enum: [downgrade, cancel, revert]
        tier:
          type: string
          enum: [base, plus]
          description: Target tier — required when action is "downgrade"
      required:
        - action

    ReferralInfo:
      type: object
      properties:
        code:
          type: string
        totalReferrals:
          type: number
        earnedPasses:
          type: number
        pendingPasses:
          type: number
        invited:
          type: array
          items:
            $ref: "#/components/schemas/InvitedFriend"
      required:
        - code
        - totalReferrals
        - earnedPasses
        - pendingPasses
        - invited

    InvitedFriend:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [joined, pending]
      required:
        - name
        - status

    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        type:
          type: string
          enum: [queue_update, flight_confirmed, membership, referral, system]
        read:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - title
        - body
        - type
        - read
        - createdAt
