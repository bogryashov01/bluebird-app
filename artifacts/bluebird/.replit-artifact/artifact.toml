kind = "mobile"
previewPath = "/bluebird/"
title = "Bluebird"
description = "Bluebird is a private aviation mobile app. Members browse last-minute empty-leg flights, join a queue for a seat, manage membership tiers (Base, Plus, Skip the Line Passes, AI Concierge), and track their trips. The design features a dark navy and bright blue palette inspired by night-sky aviation."
version = "1.0.0"
id = "artifacts/bluebird"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/bluebird/" ]
localPort = 20104

[services.development]
run = "pnpm --filter @workspace/bluebird run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bluebird", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bluebird", "run", "serve" ]

[services.env]
PORT = "20104"
BASE_PATH = "/bluebird/"
