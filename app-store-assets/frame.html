<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
  /* Rendered by render.sh at the exact App Store pixel size (device scale 1). */
  :root { --navy-deep: #060B1F; --navy: #0A1128; --blue: #1259F2; --text: #FFFFFF; --muted: #AEB8D6; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    background: radial-gradient(120% 60% at 50% 0%, #13306F 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color: var(--text); font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; overflow: hidden;
  }
  .top { padding-top: 6.5vh; display: flex; flex-direction: column; align-items: center; gap: 2.2vh; width: 86%; }
  .logo { height: 3.4vh; }
  h1 { margin: 0; font-weight: 800; font-size: 6.6vw; line-height: 1.08; letter-spacing: -0.02em; text-align: center; text-wrap: balance; }
  .sub { margin: 0; font-weight: 500; font-size: 3.5vw; line-height: 1.35; color: var(--muted); text-align: center; text-wrap: balance; }
  .device {
    margin-top: 4.5vh; width: 78%; aspect-ratio: var(--shot-ratio, 0.4614);
    border-radius: 7.5vw; padding: 1.6vw; background: #1B2340;
    box-shadow: 0 4vh 9vh rgba(0,0,0,.55), inset 0 0 0 0.35vw rgba(255,255,255,.10);
  }
  .screen { width: 100%; height: 100%; border-radius: 6.2vw; overflow: hidden; background: #000; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
  <div class="top">
    <img class="logo" id="logo" alt="Bluebird">
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="device"><div class="screen" id="screen"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('logo').src = q.get('logo');
  document.getElementById('headline').textContent = q.get('headline') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
  const screen = document.getElementById('screen');
  const [rw, rh] = (q.get('ratio') || '').split('/').map(Number);
  if (rw > 0 && rh > 0) document.querySelector('.device').style.setProperty('--shot-ratio', String(rw / rh));
  const img = new Image(); img.src = q.get('img'); img.alt = ''; screen.appendChild(img);
</script>
</body>
</html>
